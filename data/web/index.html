<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlaskMCX 启动器</title>
    <style>
        :root {
            --maincolor : #444;
            --ops-maincolor:#999;
            --themecolor: #3c8527;
        }
        [data-theme="neon"]{
            --maincolor: #444;
            --ops-maincolor:#999;
            --themecolor : #27008a;
        }
        [data-theme="sapphire"]{
            --maincolor: white;
            --ops-maincolor:#000;
            --themecolor: #00f7ff;
        }
        @font-face {
            font-family: "unifont";
            src:url('/static/font/unifont.otf');
        }
        @font-face {
            font-family: "jbmono";
            src:url('/static/font/jbmono.ttf');
        }
        * {
            font-family: 'jbmono', 'unifont', 'Consolas', 'Courier New', monospace;
        }
        button {
            border:2px solid var(--themecolor);
            border-radius:5px;
            background: var(--maincolor);
        }
        div {
            background:none;
        }
        a,p,h1,h2,h3,h4,h5,h6,button,span{

            color:var(--themecolor);
        }
        body {
            background-image:url('/static/background.png');
            color: #ffffff;
            font-family: 'jbmono', 'unifont', 'Consolas', 'Courier New', monospace;
            background-repeat: no-repeat;
            background-size:cover;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .launcher-panel {
            background: var(--maincolor);
            padding: 20px 30px 30px 30px;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            border:var(--themecolor) solid 2px;
            width: 340px; /* 稍微加宽以容纳 Tab */
        }
        h2 {
            margin-top: 0;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
        }

        /* --- Tab 导航栏 --- */
        .tabs {
            display: flex;
            border-bottom: 1px solid var(--themecolor);
            margin-bottom: 20px;
            background: var(--maincolor);
            color : var(--themecolor);
        }
        .tab-btn {
            flex: 1;
            background: var(--maincolor);
            color: var(--themecolor);
            border: none;
            padding: 10px 0;
            font-size: 14px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            border-bottom: 2px solid transparent;
            margin-bottom: 0;
        }
        .tab-btn:hover {
            color: var(--ops-maincolor);
            background: transparent;
            box-shadow: none;
        }
        .tab-btn.active {
            color: var(--ops-maincolor);
            border-bottom: 2px solid var(--ops-maincolor);
        }

        /* --- Tab 内容区 --- */
        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .tab-content.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- 表单元素 --- */
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            box-sizing: border-box;
            background: #1e1e1e;
            color: white;
            border: 1px solid #555;
            border-radius: 5px;
            font-family: inherit;
        }
        input:focus { outline: none; border-color: #3c8527; }

        button {
            background-color: #3c8527;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
            font-weight: bold;
            margin-bottom: 10px;
        }
        button:hover {
            background-color: #4CAF50;
            box-shadow: 0 0 10px #3c8527;
        }
        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
        #authBtn { background-color: #0078D4; }
        #authBtn:hover {
            background-color: #2b88d8;
            box-shadow: 0 0 10px #0078D4;
        }

        /* --- 授权面板 --- */
        #authPanel {
            display: none;
            background: #1e1e1e;
            border: 1px dashed #0078D4;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            text-align: left;
        }
        #authPanel p { margin: 5px 0; font-size: 13px; }
        #authPanel span {
            color: #4CAF50;
            font-weight: bold;
            font-size: 16px;
            user-select: all;
        }

        /* --- 状态栏 --- */
        #status {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #444;
            font-size: 13px;
            color: #a0a0a0;
            word-break: break-all;
            height: 20px;
        }

        #avatar {
            width:54px;
            display:block;
            margin: 30px auto;
        }
    </style>
</head>
<body>

    <div class="launcher-panel">
        <h2>FlaskMCX</h2>

        <!-- Tab 导航 -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('account')">账号</button>
            <button class="tab-btn" onclick="switchTab('game')">游戏</button>
            <button class="tab-btn" onclick="switchTab('settings')">设置</button>
        </div>

        <!-- Tab 1: 账号 -->
        <div id="tab-account" class="tab-content active">
            <div id="authPanel">
                <p>请访问: <a href="#" id="authUrl" target="_blank" style="color:#0078D4;">微软授权链接</a></p>
                <p>输入代码: <span id="authCode">------</span></p>
                <button onclick="finishAuth()" style="background:#4CAF50; padding:8px; font-size:13px;">我已授权，完成验证</button>
            </div>
            <img id="avatar" alt="5464">
            <input type="text" id="username" placeholder="离线游戏ID">
            <button id="authBtn" onclick="startAuth()">Microsoft 正版验证</button>
            <button onclick="setname(document.getElementById('username').value)" style="background-color: #333;">保存离线 ID</button>
        </div>

        <!-- Tab 2: 游戏 -->
        <div id="tab-game" class="tab-content">
            <input type="text" id="version" placeholder="输入版本 (如 1.21.1)">
            <button id="launchBtn" onclick="launch(document.getElementById('version').value)">启动游戏</button>
            <button id="installBtn" onclick="install(document.getElementById('version').value)" style="background-color: #333;">安装游戏</button>
        </div>

        <!-- Tab 3: 设置 -->
        <div id="tab-settings" class="tab-content">
            <input type="text" id="jvmset" placeholder="JVM参数 (JSON数组)" value="[]">
            <button id="savejvm" onclick="saveJvm()">保存 JVM 参数</button>
            <select id="themeset" onchange="changetheme(this.value)">
                <option value="default">极客绿（默认）</option>
                <option value="neon">霓虹紫</option>
                <option value="sapphire">宝石蓝</option>
            </select>
        </div>

        <!-- 底部状态栏 -->
        <p id="status">准备就绪...</p>
    </div>

    <script>
        const API_BASE = 'http://localhost:5000';
        function changetheme(name){
            if(name === "default"){
                document.documentElement.removeAttribute('data-theme');
            }else{
                document.documentElement.setAttribute('data-theme',name)
            }
            localStorage.setItem("theme",name)
        }
        // --- Tab 切换逻辑 ---
        function switchTab(tabId) {
            // 隐藏所有 Tab 内容和取消按钮高亮
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

            // 显示目标 Tab 和高亮按钮
            document.getElementById('tab-' + tabId).classList.add('active');
            event.target.classList.add('active');
        }

        // --- 页面初始化 ---
        window.onload = () => {
            // 恢复本地 JVM 参数
            const savedJvm = localStorage.getItem('jvmdata') || '[]';
            document.getElementById('jvmset').value = savedJvm;

            changetheme(localStorage.getItem("theme"));

            // 检查后端正版缓存
            fetch(`${API_BASE}/mcauth/get`)
                .then(res => res.json())
                .then(data => {
                    if (data.logged_in) {
                        document.getElementById('username').value = data.name;
                        document.getElementById('authBtn').innerText = "已验证: " + data.name;
                        document.getElementById('avatar').src = `https://vzge.me/face/${data.name}.png`;
                        document.getElementById('avatar').onerror = ()=>{
                            document.getElementById('avatar').src = `https://vzge.me/face/steve.png`;
                        }
                        document.getElementById('authBtn').style.backgroundColor = "#333";
                        document.getElementById('status').innerText = "正版Token缓存已加载。";
                    }
                }).catch(() => {});

            // 状态轮询
            setInterval(async () => {
                try {
                    const res = await fetch(`${API_BASE}/mcapi/status`);
                    const txt = await res.json();
                    document.getElementById('status').innerText = txt;
                } catch(e) {}
            }, 1000);
        };

        // --- 核心 API 逻辑 ---

        async function startAuth() {
            document.getElementById('status').innerText = "正在获取设备码...";
            try {
                const res = await fetch(`${API_BASE}/mcauth/start`, { method: 'POST' });
                const data = await res.json();
                if (data.url) {
                    document.getElementById('authUrl').href = data.url;
                    document.getElementById('authCode').innerText = data.code;
                    document.getElementById('authPanel').style.display = 'block';
                    document.getElementById('status').innerText = "请前往浏览器授权";
                } else {
                    document.getElementById('status').innerText = "获取失败: " + (data.error || "未知错误");
                }
            } catch (err) {
                document.getElementById('status').innerText = "请求后端失败";
            }
        }

        async function finishAuth() {
            document.getElementById('status').innerText = "正在校验授权...";
            try {
                const res = await fetch(`${API_BASE}/mcauth/succ`, { method: 'POST' });
                const data = await res.json();
                if (data.status === "success") {
                    document.getElementById('status').innerText = `验证成功！欢迎, ${data.name}`;
                    document.getElementById('authPanel').style.display = 'none';
                    document.getElementById('username').value = data.name;
                    document.getElementById('authBtn').innerText = "已验证: " + data.name;
                    document.getElementById('authBtn').style.backgroundColor = "#333";
                } else {
                    document.getElementById('status').innerText = "验证失败: " + data.msg;
                }
            } catch (err) {
                document.getElementById('status').innerText = "校验请求失败";
            }
        }

        async function launch(v) {
            if (!v) return alert("请输入版本号");
            document.getElementById('status').innerText = "正在启动...";
            try {
                const jvmData = JSON.parse(document.getElementById('jvmset').value);
                await jvmset(jvmData);

                const res = await fetch(`${API_BASE}/mcapi/launch`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ version: v })
                });
                const data = await res.json();
                document.getElementById('status').innerText = data;
            } catch(e) {
                document.getElementById('status').innerText = "启动失败，请检查 JVM 格式。";
            }
        }

        async function install(v) {
            if (!v) return alert("请输入版本号");
            document.getElementById('status').innerText = "正在安装...";
            const res = await fetch(`${API_BASE}/mcapi/install`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ version: v })
            });
            const data = await res.json();
            document.getElementById('status').innerText = data;
        }

        async function setname(n) {
            await fetch(`${API_BASE}/mcapi/nickname`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name: n })
            });
            document.getElementById('status').innerText = "离线 ID 已保存";
        }

        function saveJvm() {
            const val = document.getElementById('jvmset').value;
            try {
                const parsed = JSON.parse(val);
                if (!Array.isArray(parsed)) throw new Error();
                localStorage.setItem('jvmdata', val);
                jvmset(parsed);
                document.getElementById('status').innerText = "JVM 参数已保存";
            } catch(e) {
                alert("参数必须是合法的 JSON 数组，例如: [\"-Xmx4G\"]");
            }
        }

        async function jvmset(dataArray) {
            await fetch(`${API_BASE}/mcapi/jvmarg_set`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(dataArray)
            });
        }
    </script>
</body>
</html>
